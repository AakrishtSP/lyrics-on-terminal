[loggers]
keys=root,player,lyrics

[handlers]
keys=fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=ERROR
handlers=fileHandler

[logger_player]
level=DEBUG
handlers=fileHandler
qualname=player

[logger_lyrics]
level=DEBUG
handlers=fileHandler
qualname=lyrics

[handler_fileHandler]
class=logging.handlers.RotatingFileHandler
level=DEBUG
formatter=simpleFormatter
args=('player.log', 'a', 1000000, 3)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S